<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in — FitnessHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card card">
            <div class="auth-brand">
                <a href="index.html" class="d-inline-flex align-items-center gap-2">
                    <span class="brand-mark">F</span>
                    <span class="brand-name">FitnessHub</span>
                </a>
                <h3 class="section-title mt-4 mb-2">Welcome back</h3>
                <p class="muted mb-0">Sign in to continue your fitness journey.</p>
            </div>
            <div id="alertBox" class="alert d-none"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input id="email" class="form-control" type="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input id="password" class="form-control" type="password" required>
                </div>
                <button class="btn btn-red w-100" type="submit">Sign in <i class="bi bi-arrow-right ms-1"></i></button>
            </form>
            <div class="divider"></div>
            <p class="text-center muted mb-0">New here? <a class="text-white fw-semibold" href="register.html">Create an account</a></p>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
