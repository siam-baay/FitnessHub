<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account — FitnessHub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth-wrap"><div class="auth-card card">
<div class="auth-brand"><a href="index.html" class="d-inline-flex align-items-center gap-2"><span class="brand-mark">F</span><span class="brand-name">FitnessHub</span></a><h3 class="section-title mt-4 mb-2">Start your journey</h3><p class="muted mb-0">Create your member account in seconds.</p></div>
<div id="alertBox" class="alert d-none"></div>
<form id="registerForm">
<div class="mb-3"><label class="form-label">Full name</label><input id="full_name" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Email</label><input id="email" class="form-control" type="email" required></div>
<div class="mb-3"><label class="form-label">Phone</label><input id="phone" class="form-control"></div>
<div class="mb-3"><label class="form-label">Password</label><input id="password" class="form-control" type="password" minlength="6" required></div>
<button class="btn btn-red w-100" type="submit">Create account</button>
</form><div class="divider"></div><p class="text-center muted mb-0">Already a member? <a class="text-white fw-semibold" href="login.html">Sign in</a></p>
</div></div><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
